name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          # Custom domain: set repository variable BASE_PATH to "/" and SITE_URL to "https://yourdomain.com"
          BASE_PATH: ${{ vars.BASE_PATH || '/bengal-delta-exports/' }}
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN || 'https://mosharafsm78-hub.github.io' }}
          VITE_SITE_URL: ${{ vars.SITE_URL || 'https://mosharafsm78-hub.github.io/bengal-delta-exports' }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://pmyfswozvkdpqgnsiibf.supabase.co' }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_KEY || 'sb_publishable_RrciEiRwRPkbU6yO6wt8Zg_BI0tSYEW' }}
        run: npm run build
      - name: Add 404 page
        run: cp dist/client/not-found/index.html dist/client/404.html && touch dist/client/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
